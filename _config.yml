title: Tulkaa kaikki Kannelmäki
description: Tulkaa kaikki Kannelmäki on ehdokaslista Kannelmäen seurakunnan seurakuntavaaleissa 2026.
lang: fi

# Sivusto on omassa domainissa (tiedosto CNAME), joten baseurl on tyhjä.
baseurl: ""
url: https://tulkaakaikkikannelmaki.fi

markdown: kramdown

collections:
  ehdokkaat:
    output: true
    permalink: /ehdokkaat/:name/

defaults:
  - scope: { path: "", type: ehdokkaat }
    values: { layout: ehdokas }

exclude:
  - README.md
  - OHJE-YLLAPITAJILLE.md
  - OHJE-KAYTTOONOTTO.md
  - Gemfile
  - Gemfile.lock
