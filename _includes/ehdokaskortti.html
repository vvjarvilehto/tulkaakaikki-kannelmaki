{%- assign e = include.ehdokas -%}
<article class="ehdokas">
  <a class="ehdokas__linkki" href="{{ e.url | relative_url }}">
    <div class="ehdokas__kuva">
      {%- if e.kuva and e.kuva != "" %}
      <img src="{% include kuva.html src=e.kuva %}" alt="{{ e.title }}" loading="lazy">
      {%- else %}
      <img class="paikkamerkki" src="{{ '/assets/img/kynttila.svg' | relative_url }}" alt="">
      {%- endif %}
    </div>
    <h3>{{ e.title }}</h3>
  </a>
  {%- if e.titteli %}<p class="ehdokas__titteli">{{ e.titteli }}</p>{% endif %}
  {%- include ehdokasnumerot.html ehdokas=e %}
  {%- if e.lyhyesti %}<p>{{ e.lyhyesti }}</p>{% endif %}
</article>
