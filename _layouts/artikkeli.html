---
layout: default
---
<article class="osio">
  <div class="kehys kapea">
    <p class="yla"><a href="{{ '/ajankohtaista/' | relative_url }}">← Ajankohtaista</a></p>
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d.%-m.%Y' }}</time>
    <h1>{{ page.title }}</h1>
    {%- if page.kuva and page.kuva != "" %}
    <img class="artikkeli__kuva" src="{% include kuva.html src=page.kuva %}" alt="">
    {%- endif %}
    <div class="leipateksti">{{ content }}</div>
  </div>
</article>
